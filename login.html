<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-panel">
            <div class="auth-form-wrapper">
                <div class="form-header">
                    <h2>Welcome Back!</h2>
                    <p>Login to access your college portal.</p>
                </div>
                <form class="form" id="login-form">
                    <div class="form-control">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-control">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-control">
                        <label for="role">Role</label>
                        <select id="role" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="admin">Admin</option>
                            <option value="participant">Participant</option>
                            <option value="evaluator">Evaluator</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p class="form-footer">Don't have an account? <a href="register.html">Sign Up</a></p>
                </form>
            </div>
        </div>
        <div class="auth-showcase">
            <div class="showcase-content">
                <h3>Saranathan College of Engineering</h3>
                <p>"Winners Begin with Saranathan"</p>
                <img src="https://placehold.co/400x300?text=College+Campus" alt="College Campus">
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
